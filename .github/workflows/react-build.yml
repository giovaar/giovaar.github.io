
name: React Portfolio - Build

# Compilar automaticamente los cambios de main
on:
  push:
    branches:
      - main

  workflow_dispatch:

# Permisos de lectura del repositorio
permissions:
  contents: read

jobs:
  build:
    name: Compilar portafolio React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-app

    steps:
      # Descargar el codigo del repositorio
      - name: Obtener codigo
        uses: actions/checkout@v4

      # Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      # Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # Compilar React con Vite
      - name: Generar version de produccion
        run: npm run build

      # Guardar los archivos compilados
      - name: Guardar compilacion
        uses: actions/upload-artifact@v4
        with:
          name: gio-portfolio-react
          path: react-app/dist/
          retention-days: 7
